<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1122" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="footerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Motto Gradient -->
    <linearGradient id="mottoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ambient Core Glows -->
    <radialGradient id="footerCenterGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="footerGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
      <circle cx="0" cy="0" r="0.8" fill="rgba(6, 182, 212, 0.2)" />
    </pattern>

    <style>
      @keyframes footerPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes borderShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; }
      }
      .pulsing-led {
        animation: footerPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .shimmer-border {
        animation: borderShimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Layer -->
  <rect width="920" height="180" rx="16" fill="url(#footerBg)" />
  <rect width="920" height="180" rx="16" fill="url(#footerGrid)" />

  <!-- Ambient Glow -->
  <rect width="920" height="180" rx="16" fill="url(#footerCenterGlow)" />

  <!-- Border -->
  <rect x="2" y="2" width="916" height="176" rx="15" fill="none" stroke="url(#footerBorderGrad)" stroke-width="2" class="shimmer-border" />

  <!-- Top Accent Cyber Notches -->
  <path d="M 40 2 L 60 12 L 200 12 L 210 2" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M 710 2 L 720 12 L 860 12 L 880 2" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Main Animated Motto -->
  <g transform="translate(460, 68)">
    <text fill="url(#mottoGrad)" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle">
      CODE • BUILD • SCALE • REPEAT
    </text>
  </g>

  <!-- Mission Subtitle -->
  <g transform="translate(460, 98)">
    <text fill="#94a3b8" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="2" 
          text-anchor="middle">
      HIGH-CONCURRENCY ARCHITECTURE  //  ZERO DOWNTIME  //  DISTRIBUTED RESILIENCE
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="42" y1="126" x2="878" y2="126" stroke="url(#footerBorderGrad)" stroke-opacity="0.3" stroke-width="1" />

  <!-- Telemetry Metadata Bottom Row -->
  <g transform="translate(42, 152)">
    <!-- Status LED & Text -->
    <circle cx="8" cy="-4" r="4.5" fill="#10b981" class="pulsing-led" />
    <circle cx="8" cy="-4" r="7.5" fill="none" stroke="#10b981" stroke-opacity="0.4" class="pulsing-led" />
    <text x="24" y="0" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEM OPERATIONAL</text>

    <!-- Center Base -->
    <text x="418" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">
      DHAKA, BANGLADESH  <tspan fill="#334155">•</tspan>  OPEN FOR WORLDWIDE HIGH-IMPACT ROLES
    </text>

    <!-- Right Link -->
    <text x="836" y="0" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="end">HRSHANTO.VERCEL.APP ↗</text>
  </g>
</svg>

