<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- S-Logo Gradients -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="logoS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ambient Core Glows -->
    <radialGradient id="cyanCoreGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleCoreGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(6, 182, 212, 0.25)" />
    </pattern>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes glowShift {
        0%, 100% { stroke-opacity: 0.7; }
        50% { stroke-opacity: 1; }
      }
      .pulsing-dot {
        animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .glow-border {
        animation: glowShift 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="920" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="920" height="280" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Background Glows -->
  <circle cx="160" cy="140" r="160" fill="url(#cyanCoreGlow)" />
  <circle cx="780" cy="100" r="180" fill="url(#purpleCoreGlow)" />

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="916" height="276" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" class="glow-border" />

  <!-- Brand Logo Monogram (Exact 3D Portfolio S-Mark) -->
  <g transform="translate(42, 55)">
    <rect x="0" y="0" width="105" height="105" rx="24" fill="url(#logoBg)" stroke="url(#borderGrad)" stroke-width="2.5" />
    <circle cx="52.5" cy="52.5" r="38" fill="url(#cyanCoreGlow)" />
    <!-- Monogram S Path -->
    <path d="M 72 32 H 44 A 12 12 0 0 0 32 44 A 12 12 0 0 0 44 56 H 61 A 12 12 0 0 1 73 68 A 12 12 0 0 1 61 80 H 33" 
          fill="none" 
          stroke="url(#logoS)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Telemetry Status Pill -->
  <g transform="translate(178, 48)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
    <!-- Pulsing Green Dot -->
    <circle cx="15" cy="13" r="5" fill="#10b981" class="pulsing-dot" />
    <circle cx="15" cy="13" r="8" fill="none" stroke="#10b981" stroke-opacity="0.4" class="pulsing-dot" />
    <text x="32" y="17" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM OPERATIONAL // 2026 CORE</text>
  </g>

  <!-- Main Name Header -->
  <text x="178" y="112" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="1">HASIBUR RAHMAN SHANTO</text>

  <!-- Subtitle Role -->
  <text x="178" y="142" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">SENIOR FULL-STACK DEVELOPER &amp; SYSTEMS ARCHITECT</text>

  <!-- Tech Spec Pills -->
  <g transform="translate(178, 162)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="120" height="26" rx="6" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <text x="60" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LARAVEL 11 &amp; REDIS</text>

    <!-- Pill 2 -->
    <rect x="130" y="0" width="145" height="26" rx="6" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <text x="202.5" y="17" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MULTI-TENANT SAAS ERP</text>

    <!-- Pill 3 -->
    <rect x="285" y="0" width="130" height="26" rx="6" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="350" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WEBRTC &amp; WEBSOCKETS</text>

    <!-- Pill 4 -->
    <rect x="425" y="0" width="145" height="26" rx="6" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <text x="497.5" y="17" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SQL OPTIMIZATION</text>

    <!-- Pill 5 -->
    <rect x="580" y="0" width="115" height="26" rx="6" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <text x="637.5" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DOCKER &amp; CI/CD</text>
  </g>

  <!-- Horizontal Tech Divider -->
  <line x1="42" y1="214" x2="878" y2="214" stroke="url(#borderGrad)" stroke-opacity="0.3" stroke-width="1" />

  <!-- Bottom Metric Telemetry Strip -->
  <g transform="translate(42, 242)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11.5" font-weight="600">
      <tspan fill="#38bdf8" font-weight="800">4+ YEARS</tspan> EXP  <tspan fill="#334155">•</tspan>  
      <tspan fill="#34d399" font-weight="800">-42%</tspan> API LATENCY  <tspan fill="#334155">•</tspan>  
      <tspan fill="#22d3ee" font-weight="800">-68%</tspan> PEAK DB LOAD  <tspan fill="#334155">•</tspan>  
      <tspan fill="#a855f7" font-weight="800">10K+</tspan> BATCH TRANSCRIPTS  <tspan fill="#334155">•</tspan>  
      <tspan fill="#f59e0b" font-weight="800">7+</tspan> ENTERPRISE SYSTEMS
    </text>

    <text x="836" y="0" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" text-anchor="end">HRSHANTO.VERCEL.APP ↗</text>
  </g>
</svg>

